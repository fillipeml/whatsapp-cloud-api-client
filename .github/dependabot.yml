version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # uv, not pip: the pip ecosystem edits pyproject.toml without regenerating uv.lock, and
  # CI installs with `uv sync --locked`, so every such pull request fails on a lockfile that
  # no longer matches. The uv ecosystem updates both.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
